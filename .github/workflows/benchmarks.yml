# Runs the BenchmarkDotNet suite on demand and publishes the result exports as artifacts.
# Cross-platform only: the real-world model (VRMPARSER_REAL_VRM_PATH) and the Windows ETW
# hardware counters are intentionally not used here, so the run stays green on a hosted Linux runner.
name: Benchmarks

on:
  workflow_dispatch:
    inputs:
      filter:
        description: BenchmarkDotNet --filter glob (e.g. *GlbParse*)
        required: false
        default: '*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        global-json-file: global.json
    - name: Restore dependencies
      run: dotnet restore
    - name: Run benchmarks
      env:
        FILTER: ${{ inputs.filter }}
      run: >
        dotnet run -c Release --no-restore
        --project benchmarks/TheOmenDen.VRMParser.Benchmarks
        -- --filter "$FILTER"
    - name: Upload results
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: benchmark-results
        path: '**/BenchmarkDotNet.Artifacts/**'
        if-no-files-found: warn
